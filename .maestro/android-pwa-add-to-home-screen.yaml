appId: com.android.chrome
name: Add ${PWA_NAME} to Android home screen
---
# The CI emulator has no Play Store account, so exercise Chrome's explicit
# launcher-shortcut fallback instead of its WebAPK installation path.
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: Accept & continue
    commands:
      - tapOn: Accept & continue
- runFlow:
    when:
      visible: Use without an account
    commands:
      - tapOn: Use without an account
- runFlow:
    when:
      visible: No thanks
    commands:
      - tapOn: No thanks
- runFlow:
    when:
      visible: Got it
    commands:
      - tapOn: Got it
- openLink:
    link: ${PWA_URL}
- runFlow:
    when:
      visible: Got it
    commands:
      - tapOn: Got it
- extendedWaitUntil:
    visible: ${PWA_READY_TEXT}
    timeout: 60000
- takeScreenshot: ${PWA_SLUG}-chrome-loaded
- tapOn: Customize and control Google Chrome
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${PWA_SLUG}-chrome-menu
- runFlow:
    when:
      visible: Install app
    commands:
      - tapOn: Install app
- runFlow:
    when:
      visible: Add to Home screen
    commands:
      - tapOn: Add to Home screen
- extendedWaitUntil:
    visible: Create shortcut
    timeout: 30000
- takeScreenshot: ${PWA_SLUG}-install-prompt
- tapOn: Create shortcut
- extendedWaitUntil:
    visible: Add
    timeout: 30000
- tapOn: Add
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${PWA_SLUG}-after-add-to-home-screen
- pressKey: Home
- extendedWaitUntil:
    visible: ${PWA_NAME}
    timeout: 30000
- takeScreenshot: ${PWA_SLUG}-home-screen-after-install
- tapOn: ${PWA_NAME}
- extendedWaitUntil:
    visible: ${PWA_READY_TEXT}
    timeout: 30000
- takeScreenshot: ${PWA_SLUG}-home-screen-launch
- pressKey: Home
