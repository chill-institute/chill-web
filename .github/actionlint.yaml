self-hosted-runner:
  # actionlint 1.7.12 does not know the GitHub-hosted ubuntu-26.04 label.
  labels:
    - ubuntu-26.04
paths:
  .github/workflows/cloudflare-*-schedule.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/deploy.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/main.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
