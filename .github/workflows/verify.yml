name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-security:
    uses: ./.github/workflows/_workflow-security.yml
    permissions:
      actions: read
      contents: read

  verify-app:
    uses: ./.github/workflows/_verify-app.yml
    with:
      artifact-name: web-dist-${{ github.run_id }}

  e2e:
    needs: verify-app
    if: ${{ needs.verify-app.result == 'success' }}
    uses: ./.github/workflows/_e2e.yml
    with:
      dist-artifact-name: web-dist-${{ github.run_id }}

  verify-result:
    runs-on: ubuntu-26.04
    needs: [workflow-security, verify-app, e2e]
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
