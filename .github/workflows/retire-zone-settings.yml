name: Retire Zone Settings From SST

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview or execute the retained-resource state cutover
        required: true
        default: preview
        type: choice
        options:
          - preview
          - retire
      expected_sst_state_commit:
        description: Full current commit SHA from chill-web-sst-state
        required: true
        type: string
      confirmation:
        description: For retire, type retain-four-zone-settings
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: web-deploy-staging
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate current main and retirement intent
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      source-sha: ${{ steps.validate.outputs.source_sha }}
      expected-state-commit: ${{ steps.validate.outputs.expected_state_commit }}
    steps:
      - name: Resolve trusted source and state base
        id: validate
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_SST_STATE_COMMIT: ${{ inputs.expected_sst_state_commit }}
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$RUN_SHA" != "$source_sha" ]; then
            echo "SST zone retirement must run from the current main commit" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SST_STATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sst_state_commit must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [ "$OPERATION" = "retire" ] && [ "$CONFIRMATION" != "retain-four-zone-settings" ]; then
            echo "confirmation does not match the exact retained-resource operation" >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >>"$GITHUB_OUTPUT"
          echo "expected_state_commit=$EXPECTED_SST_STATE_COMMIT" >>"$GITHUB_OUTPUT"

  zone-retirement:
    name: ${{ inputs.operation == 'retire' && 'Retain and retire four zone settings' || 'Preview zone-setting retirement' }}
    needs: validate-source
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    environment:
      name: staging
      url: https://${{ vars.CHILL_STAGING_DOMAIN }}
    env:
      BINGE_PRODUCTION_DOMAIN: ${{ vars.BINGE_PRODUCTION_DOMAIN }}
      BINGE_PRODUCTION_REDIRECT_DOMAIN: ${{ vars.BINGE_PRODUCTION_REDIRECT_DOMAIN }}
      CHILL_PRODUCTION_DOMAIN: ${{ vars.CHILL_PRODUCTION_DOMAIN }}
      CHILL_STAGING_DOMAIN: ${{ vars.CHILL_STAGING_DOMAIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      EXPECTED_SST_STATE_COMMIT: ${{ needs.validate-source.outputs.expected-state-commit }}
      SST_STATE_AGE_IDENTITY: ${{ secrets.SST_STATE_AGE_IDENTITY }}
      SST_STATE_AGE_RECIPIENT: ${{ vars.SST_STATE_AGE_RECIPIENT }}
      SST_STATE_FILE: ${{ vars.SST_STATE_FILE_STAGING }}
      SST_STATE_REPO: ${{ vars.SST_STATE_REPO }}
      SST_STATE_REPO_TOKEN: ${{ secrets.SST_STATE_REPO_TOKEN }}
      WEB_DEPLOY_TARGET: zones
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.source-sha }}
          persist-credentials: false

      - name: Set up Vite+
        uses: ./.github/actions/setup-vite-plus
        with:
          cache: false

      - name: Install age
        run: scripts/ci/install-age

      - name: Restore the authorized encrypted SST state
        run: scripts/ci/sst-state-git restore

      - name: Preview exact retained-resource retirement
        run: |
          vp exec sst diff --stage staging --json >"$RUNNER_TEMP/zone-retirement-pre.json"
          node scripts/ci/guard-sst-zone-retirement.ts \
            pre-deploy "$RUNNER_TEMP/zone-retirement-pre.json"

      - name: Retain live settings and retire them from SST state
        if: ${{ inputs.operation == 'retire' }}
        run: vp exec sst deploy --stage staging --print-logs

      - name: Save retired encrypted SST state
        if: ${{ inputs.operation == 'retire' }}
        env:
          EXPECTED_SST_STATE_COMMIT: ""
        run: scripts/ci/sst-state-git save

      - name: Require an empty post-retirement diff
        if: ${{ inputs.operation == 'retire' }}
        run: |
          vp exec sst diff --stage staging --json >"$RUNNER_TEMP/zone-retirement-post.json"
          node scripts/ci/guard-sst-zone-retirement.ts \
            post-deploy "$RUNNER_TEMP/zone-retirement-post.json"

      - name: Remove retirement previews
        if: always()
        run: rm -f "$RUNNER_TEMP/zone-retirement-pre.json" "$RUNNER_TEMP/zone-retirement-post.json"
