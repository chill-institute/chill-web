name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Default-branch name or reachable full commit SHA to deploy
        required: true
        type: string
      target:
        description: Deployment target
        required: true
        default: app
        type: choice
        options:
          - app
permissions:
  contents: read

concurrency:
  group: web-deploy-staging
  cancel-in-progress: false

jobs:
  workflow-security:
    uses: ./.github/workflows/_workflow-security.yml
    permissions:
      actions: read
      contents: read

  validate:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.validate.outputs.ref }}
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - name: Validate ref
        id: validate
        env:
          TARGET: ${{ inputs.target }}
          INPUT_REF: ${{ inputs.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "${WORKFLOW_REF}" != "${DEFAULT_BRANCH}" ]; then
            echo "Deploy Staging must be run from ${DEFAULT_BRANCH}; got ${WORKFLOW_REF}" >&2
            exit 1
          fi

          ref="$(printf '%s' "${INPUT_REF}" | tr -d '[:space:]')"
          if [ -z "${ref}" ]; then
            echo "ref is required" >&2
            exit 1
          fi

          case "${ref}" in
            refs/*|pull/*|origin/*|*://*|*..*|*~*|*^*|*:*|*' '*)
              echo "unsupported ref: ${ref}" >&2
              exit 1
              ;;
          esac

          if printf '%s' "${ref}" | grep -Eq '^[0-9a-f]{40}$'; then
            sha="${ref}"
            if ! gh api "repos/${REPOSITORY}/commits/${sha}" --silent; then
              echo "commit SHA not found in ${REPOSITORY}: ${sha}" >&2
              exit 1
            fi
          else
            if ! git check-ref-format --branch "${ref}" >/dev/null 2>&1; then
              echo "invalid branch name: ${ref}" >&2
              exit 1
            fi

            sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/${ref}" --jq '.object.sha')"
            if [ -z "${sha}" ]; then
              echo "branch not found in ${REPOSITORY}: ${ref}" >&2
              exit 1
            fi
          fi

          default_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" --jq '.object.sha')"
          comparison_status="$(gh api "repos/${REPOSITORY}/compare/${sha}...${default_sha}" --jq '.status')"
          if [ "${comparison_status}" != "ahead" ] && [ "${comparison_status}" != "identical" ]; then
            echo "staging deploys must use a commit reachable from ${DEFAULT_BRANCH}; got ${sha}" >&2
            exit 1
          fi

          if [ "${TARGET}" != "app" ]; then
            echo "unsupported target: ${TARGET}" >&2
            exit 1
          fi

          {
            echo "ref=${ref}"
            echo "sha=${sha}"
          } >> "${GITHUB_OUTPUT}"

  verify-app:
    needs: [workflow-security, validate]
    if: ${{ needs.workflow-security.result == 'success' }}
    concurrency:
      group: web-staging-verify-app-${{ needs.validate.outputs.sha }}
      cancel-in-progress: true
    uses: ./.github/workflows/_verify-app.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  deploy-app:
    needs: [validate, verify-app]
    if: ${{ needs.verify-app.result == 'success' }}
    uses: ./.github/workflows/_deploy-app.yml
    with:
      environment-name: staging
      environment-url: https://${{ vars.CHILL_STAGING_DOMAIN }}
      ref: ${{ needs.validate.outputs.sha }}
      sst-state-file: ${{ vars.SST_STATE_FILE_STAGING }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SST_STATE_AGE_IDENTITY: ${{ secrets.SST_STATE_AGE_IDENTITY }}
      SST_STATE_REPO_TOKEN: ${{ secrets.SST_STATE_REPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
