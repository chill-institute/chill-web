name: Deploy App

on:
  workflow_call:
    inputs:
      environment-name:
        description: GitHub Environment name and SST stage to deploy through.
        required: true
        type: string
      environment-url:
        description: Deployment URL for the GitHub Environment.
        required: true
        type: string
      ref:
        description: Exact commit to build and deploy.
        required: true
        type: string
      sst-state-file:
        description: Encrypted SST state file for this environment.
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      SST_STATE_AGE_IDENTITY:
        required: true
      SST_STATE_REPO_TOKEN:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build-app:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment-name }}
      deployment: false
    outputs:
      sentry-dsn: ${{ steps.sentry.outputs.dsn }}
    env:
      BINGE_PRODUCTION_DOMAIN: ${{ vars.BINGE_PRODUCTION_DOMAIN }}
      BINGE_PRODUCTION_REDIRECT_DOMAIN: ${{ vars.BINGE_PRODUCTION_REDIRECT_DOMAIN }}
      CHILL_PRODUCTION_DOMAIN: ${{ vars.CHILL_PRODUCTION_DOMAIN }}
      CHILL_STAGING_DOMAIN: ${{ vars.CHILL_STAGING_DOMAIN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      VITE_PUBLIC_SENTRY_DSN: ${{ vars.VITE_PUBLIC_SENTRY_DSN }}
      VITE_PUBLIC_SENTRY_ENVIRONMENT: ${{ inputs.environment-name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Vite+
        uses: ./.github/actions/setup-vite-plus

      - name: Load Vite+ environment
        run: vp env

      - name: Stamp release
        run: |
          {
            echo "VITE_PUBLIC_VERSION=0.0.$(git rev-list --count --first-parent HEAD)"
            echo "VITE_PUBLIC_RELEASE=$(git rev-parse --short HEAD)"
          } >>"$GITHUB_ENV"

      - name: Build app artifact
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: vp run build

      - name: Record public Sentry DSN
        id: sentry
        run: echo "dsn=${VITE_PUBLIC_SENTRY_DSN}" >>"$GITHUB_OUTPUT"

      - name: Create artifact manifest
        run: find dist -type f -print0 | sort -z | xargs -0 sha256sum >dist.sha256

      - name: Upload app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-app-${{ inputs.environment-name }}-${{ github.run_id }}
          path: |
            dist
            dist.sha256
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: build-app
    uses: ./.github/workflows/_e2e.yml
    with:
      artifact-name: playwright-${{ inputs.environment-name }}-${{ github.run_id }}
      dist-artifact-name: web-app-${{ inputs.environment-name }}-${{ github.run_id }}
      ref: ${{ inputs.ref }}
      sentry-dsn: ${{ needs.build-app.outputs.sentry-dsn }}

  deploy-app:
    needs: e2e
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ inputs.environment-url }}
    env:
      BINGE_PRODUCTION_DOMAIN: ${{ vars.BINGE_PRODUCTION_DOMAIN }}
      BINGE_PRODUCTION_REDIRECT_DOMAIN: ${{ vars.BINGE_PRODUCTION_REDIRECT_DOMAIN }}
      CHILL_PRODUCTION_DOMAIN: ${{ vars.CHILL_PRODUCTION_DOMAIN }}
      CHILL_STAGING_DOMAIN: ${{ vars.CHILL_STAGING_DOMAIN }}
      WEB_DEPLOY_TARGET: app
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SST_STATE_REPO: ${{ vars.SST_STATE_REPO }}
      SST_STATE_FILE: ${{ inputs.sst-state-file }}
      SST_STATE_AGE_RECIPIENT: ${{ vars.SST_STATE_AGE_RECIPIENT }}
      SST_STATE_AGE_IDENTITY: ${{ secrets.SST_STATE_AGE_IDENTITY }}
      SST_STATE_REPO_TOKEN: ${{ secrets.SST_STATE_REPO_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Vite+
        uses: ./.github/actions/setup-vite-plus

      - name: Download app artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-app-${{ inputs.environment-name }}-${{ github.run_id }}
          path: .

      - name: Verify tested app artifact
        env:
          TESTED_SHA256: ${{ needs.e2e.outputs.artifact-sha256 }}
        run: |
          set -euo pipefail
          sha256sum --check --quiet dist.sha256
          echo "${TESTED_SHA256}  dist.sha256" | sha256sum --check

      - name: Install age
        run: scripts/ci/install-age

      - name: Restore encrypted SST local state
        id: restore-sst-state
        run: scripts/ci/sst-state-git restore

      - name: Deploy app artifact to SST
        env:
          SST_STAGE: ${{ inputs.environment-name }}
        run: vp exec sst deploy --stage "$SST_STAGE" --print-logs

      - name: Save encrypted SST local state
        if: ${{ always() && steps.restore-sst-state.outcome == 'success' }}
        run: scripts/ci/sst-state-git save
