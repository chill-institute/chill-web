name: End-To-End

on:
  workflow_call:
    inputs:
      artifact-name:
        default: playwright-artifacts
        description: Artifact name to use when Playwright fails.
        required: false
        type: string
      dist-artifact-name:
        description: Name of the built dist artifact to download.
        required: true
        type: string
      ref:
        description: Git ref to test.
        required: false
        type: string
      sentry-dsn:
        default: ""
        description: Public Sentry DSN built into the artifact, if any.
        required: false
        type: string
    outputs:
      artifact-sha256:
        description: SHA-256 of the tested artifact manifest.
        value: ${{ jobs.e2e.outputs.artifact-sha256 }}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    outputs:
      artifact-sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Vite+
        uses: ./.github/actions/setup-vite-plus

      - name: Install Playwright browser
        run: vp exec playwright install --with-deps chromium webkit

      - name: Download built app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.dist-artifact-name }}
          path: .

      - name: Verify and record built app
        id: artifact
        run: |
          set -euo pipefail
          sha256sum --check --quiet dist.sha256
          sha256="$(sha256sum dist.sha256 | cut -d ' ' -f 1)"
          echo "sha256=${sha256}" >>"$GITHUB_OUTPUT"
          echo "Tested artifact manifest SHA-256: \`${sha256}\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Run end-to-end tests
        env:
          VITE_PUBLIC_SENTRY_DSN: ${{ inputs.sentry-dsn }}
        run: vp run e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
