name: Set up Vite+
description: Set up the repo-pinned Vite+ toolchain.

inputs:
  cache:
    description: Enable Vite+ dependency caching.
    default: "true"
  run-install:
    description: Let setup-vp run vp install.
    default: "true"

runs:
  using: composite
  steps:
    - name: Read Vite+ version
      id: vite_plus
      shell: bash
      run: |
        set -euo pipefail

        version="$(scripts/ci/vite-plus-version)"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"

    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
      with:
        version: ${{ steps.vite_plus.outputs.version }}
        node-version-file: ".node-version"
        cache: ${{ inputs.cache }}
        run-install: ${{ inputs.run-install }}

    - name: Load Vite+ environment
      shell: bash
      run: vp env
